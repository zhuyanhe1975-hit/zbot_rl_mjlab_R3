      joint_vel:
        .*: 0.0
    spec_fn: !!python/name:mjlab.entity.entity.%3Clambda%3E ''
    articulation: null
    sort_actuators: false
    lights: !!python/tuple
    - name: sun
      body: world
      mode: fixed
      target: null
      type: directional
      castshadow: true
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 1.5
      dir: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
      cutoff: 45.0
      exponent: 10.0
      diffuse: null
      specular: null
      ambient: null
      active: true
      attenuation: !!python/tuple
      - 1.0
      - 0.0
      - 0.0
    cameras: !!python/tuple []
    textures: !!python/tuple
    - name: groundplane
      type: 2d
      builtin: checker
      rgb1: !!python/tuple
      - 0.2
      - 0.3
      - 0.4
      rgb2: !!python/tuple
      - 0.1
      - 0.2
      - 0.3
      width: 300
      height: 300
      mark: edge
      markrgb: !!python/tuple
      - 0.8
      - 0.8
      - 0.8
      random: 0.01
      file: null
      cubefiles: null
      gridsize: null
      gridlayout: null
      nchannel: 3
      hflip: false
      vflip: false
    materials: !!python/tuple
    - name: groundplane
      rgba: !!python/tuple
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      texuniform: true
      texrepeat: !!python/tuple
      - 4.0
      - 4.0
      reflectance: 0.2
      texture: groundplane
      geom_names_expr: !!python/tuple
      - terrain$
    meshes: !!python/tuple []
    geoms: !!python/tuple
    - geom_names_expr: !!python/tuple
      - terrain$
      group: null
      contype: null
      conaffinity: null
      condim: null
      priority: null
      friction: !!python/tuple
      - 0.6
      - 0.005
      - 0.0001
      solref: null
      solimp: null
      margin: null
      gap: null
      solmix: null
    collisions: !!python/tuple []
    terrain_type: plane
    terrain_generator: null
    env_spacing: 4.0
    max_init_terrain_level: null
    num_envs: 8192
    debug_vis: false
  entities:
    robot:
      init_state:
        pos: !!python/tuple
        - 0.0
        - 0.0
        - 0.0555
        rot: !!python/tuple
        - 0.7071067811865476
        - 0.0
        - -0.7071067811865476
        - 0.0
        lin_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        ang_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        joint_pos:
          .*: 0.0
        joint_vel:
          .*: 0.0
      spec_fn: !!python/name:zbot_rl_mjlab.tasks.transformation.env_cfg.full_body_spec ''
      articulation:
        actuators: !!python/tuple
        - target_names_expr: !!python/tuple
          - joint1
          - joint2
          - joint3
          - joint4
          - joint5
          - joint6
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.001
          frictionloss: null
          viscous_damping: null
          delay_min_lag: 0
          delay_max_lag: 0
          delay_hold_prob: 0.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 15.0
          damping: 1.5
          effort_limit: 20.0
        soft_joint_pos_limit_factor: 1.0
      sort_actuators: false
      lights: !!python/tuple []
      cameras: !!python/tuple []
      textures: !!python/tuple []
      materials: !!python/tuple []
      meshes: !!python/tuple []
      geoms: !!python/tuple []
      collisions: !!python/tuple []
  sensors: !!python/tuple
  - name: snake_ground_contact
    primary:
      mode: geom
      pattern: .*_geom
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: maxforce
    num_slots: 1
    secondary_policy: first
    track_air_time: false
    global_frame: false
    history_length: 4
    debug: false
  - name: snake_self_contact
    primary:
      mode: subtree
      pattern: foot_0
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: subtree
      pattern: foot_0
      entity: robot
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    - dist
    reduce: maxforce
    num_slots: 1
    secondary_policy: first
    track_air_time: false
    global_frame: false
    history_length: 4
    debug: false
  - name: head_lin_acc
    sensor_type: framelinacc
    obj:
      type: xbody
      name: foot_0
      entity: robot
    ref: null
    cutoff: 0.0
  - name: head_ang_acc
    sensor_type: frameangacc
    obj:
      type: xbody
      name: foot_0
      entity: robot
    ref: null
    cutoff: 0.0
  extent: null
  spec_fn: null
